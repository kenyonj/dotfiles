# Herdr config — keybindings mirror ~/.tmux.conf where herdr has an equivalent.
# Managed in dotfiles: config/herdr/config.toml -> ~/.config/herdr/config.toml

# Skip first-run onboarding (existing preference).
onboarding = false

[theme]
name = "gruvbox"

[terminal]
# tmux opens new windows/panes with -c '#{pane_current_path}'.
new_cwd = "follow"

[keys]
# tmux: set -g prefix C-a
prefix = "ctrl+a"

# tmux: bind r source-file (reload). Herdr's default r is resize_mode, so swap the two.
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# tmux: bind c new-window
new_tab = "prefix+c"

# tmux: bind '-' split-window (stacked); bind '|' split-window -h (side-by-side)
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"

# tmux: default prefix-x kill-pane
close_pane = "prefix+x"

# tmux: bind h/j/k/l select-pane; ctrl+h/j/k/l for prefix-less directional nav
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

# tmux: bind a set-option status (toggle UI chrome)
toggle_sidebar = "prefix+a"

# Session navigator on prefix+p (its default prefix+g is taken by lazygit below).
# Displaces previous_tab, which we unset to avoid a duplicate binding.
goto = "prefix+p"
previous_tab = ""

# tmux: bind g display-popup lazygit
[[keys.command]]
key = "prefix+g"
type = "pane"
command = "lazygit"

# tmux: bind t display-popup $SHELL
[[keys.command]]
key = "prefix+t"
type = "pane"
command = "$SHELL"

# tmux: bind Left/Right/Up/Down resize-pane. Herdr has no direct resize binding,
# so drive `herdr pane resize` (amount is a fraction of the tab) via shell commands.
[[keys.command]]
key = "prefix+left"
type = "shell"
command = 'herdr pane resize --direction left --amount 0.05 --pane "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+right"
type = "shell"
command = 'herdr pane resize --direction right --amount 0.05 --pane "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+up"
type = "shell"
command = 'herdr pane resize --direction up --amount 0.05 --pane "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+down"
type = "shell"
command = 'herdr pane resize --direction down --amount 0.05 --pane "$HERDR_ACTIVE_PANE_ID"'

[ui]
agent_panel_scope = "all"
show_agent_labels_on_pane_borders = true
# tmux: set -g mouse on
mouse_capture = true

[ui.toast]
delivery = "herdr"
